services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: fruits
      POSTGRES_USER: fruits
      POSTGRES_PASSWORD: fruits
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./db.sql:/docker-entrypoint-initdb.d/001-db.sql:ro
      - postgres-data:/var/lib/postgresql
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}
    # Leave empty locally; the dedicated host runner sets nonoverlapping CPU sets.
    cpuset: "${POSTGRES_CPUSET:-}"
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fruits -d fruits"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s
    # Keep crash durability, WAL, checkpoints and autovacuum enabled.
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=100", "-c", "fsync=on", "-c", "synchronous_commit=on", "-c", "full_page_writes=on", "-c", "autovacuum=on"]

volumes:
  postgres-data:
