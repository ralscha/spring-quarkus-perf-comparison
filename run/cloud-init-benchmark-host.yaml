#cloud-config
package_update: true
packages: [ca-certificates, git]
write_files:
  - path: /usr/local/bin/bootstrap-benchmark-host.sh
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      repo_dir=/opt/benchmarks/spring-quarkus-perf-comparison
      # Replace main with a reviewed commit to reproduce a historical run.
      repo_ref=main
      install -d /opt/benchmarks
      git clone https://github.com/ralscha/spring-quarkus-perf-comparison.git "${repo_dir}"
      git -C "${repo_dir}" checkout "${repo_ref}"
      exec bash "${repo_dir}/run/bootstrap-benchmark-host.sh"
runcmd:
  - [cloud-init-per, once, benchmark-bootstrap, /usr/local/bin/bootstrap-benchmark-host.sh]
final_message: "Benchmark bootstrap finished after $UPTIME seconds. Review /var/log/bootstrap-benchmark-host.log; run /usr/local/bin/run-benchmarks.sh when the host is idle."
